<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage pets - The stray Station</title>
    <link
      rel="shortcut icon"
      type="x-icon"
      href="https://cdn-icons-png.flaticon.com/256/2960/2960221.png"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body class="site-sticky-footer bg-light">
    <header
      class="bg-white border-bottom shadow-sm py-2 py-md-3"
    >
      <div class="container-fluid px-3 px-lg-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a class="navbar-brand fw-semibold mb-0" href="index.html">The stray Station</a>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <a class="btn btn-outline-secondary btn-sm" href="pets.html">View site</a>
          <a class="btn btn-outline-danger btn-sm" href="#" id="navLogoutBtn">Log out</a>
        </div>
      </div>
    </header>

    <main class="container-fluid px-3 px-lg-4 py-4 flex-grow-1">
      <div class="row mb-4 align-items-start g-3">
        <div class="col">
          <h1 class="h3 mb-2">Shelter listings</h1>
          <p class="text-muted small mb-0 col-lg-10">
            Create, update, or remove pets. Changes are stored in this browser (demo persistence).
          </p>
        </div>
        <div class="col-12 col-md-auto text-md-end">
          <button type="button" class="btn btn-primary btn-dash-add" id="btnAddPet">Add pet</button>
        </div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 small">
            <thead class="table-light">
              <tr>
                <th scope="col" class="d-none d-md-table-cell">Photo</th>
                <th scope="col">Name</th>
                <th scope="col">Type</th>
                <th scope="col" class="d-none d-lg-table-cell">Description</th>
                <th scope="col" class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="petsTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <div
      class="modal fade"
      id="petModal"
      tabindex="-1"
      aria-labelledby="petModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <h2 class="modal-title h5" id="petModalTitle">Add pet</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body pt-2">
            <form id="petForm" action="#" onsubmit="return false">
              <input type="hidden" id="petId" value="" />
              <div class="mb-3">
                <label class="form-label" for="petName">Name</label>
                <input type="text" class="form-control" id="petName" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="petType">Type</label>
                <select class="form-select" id="petType">
                  <option value="dogs">Dog</option>
                  <option value="cats">Cat</option>
                  <option value="diff">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="petDescription">Description</label>
                <textarea class="form-control" id="petDescription" rows="3" required></textarea>
              </div>
              <div class="mb-0">
                <label class="form-label" for="petImage">Image URL</label>
                <input type="url" class="form-control" id="petImage" placeholder="https://..." />
              </div>
            </form>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="btnSavePet">Save</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="py-3 text-center small text-muted bg-white border-top mt-auto">
      &copy; 2026 The stray Station
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth-ui.js"></script>
    <script src="js/dashboard-page.js"></script>
  </body>
</html>
