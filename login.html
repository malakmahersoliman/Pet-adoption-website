<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - The Stray Station</title>
    <link
      rel="shortcut icon"
      type="x-icon"
      href="https://cdn-icons-png.flaticon.com/256/2960/2960221.png"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body class="site-sticky-footer bg-light">
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm">
      <div class="container py-2">
        <a class="navbar-brand mb-0 fw-semibold" href="index.html">The stray Station</a>
        <div class="nav-auth-cluster d-flex align-items-center ms-auto">
          <a class="nav-link py-1" href="register.html">Register</a>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 d-flex flex-column justify-content-center bg-primary text-light w-100 py-4 py-md-5">
      <div class="container px-4 px-lg-5 py-4">
        <div class="row justify-content-center">
          <div class="col-lg-8 col-xl-6 text-center mb-4">
            <h1 class="h2 mb-3">Sign in</h1>
            <p class="text-white-75 mb-0 small mx-auto" style="max-width: 32rem">
              Sign in with the email and password stored in the MySQL database (see <code class="small">sql/stray_station.sql</code>).
            </p>
          </div>
        </div>
        <div class="row justify-content-center">
          <div class="col-md-10 col-lg-6 col-xl-5">
            <div class="bg-white text-dark rounded-3 shadow p-4 p-md-5">
              <div class="alert alert-danger d-none mb-3" id="loginError" role="alert"></div>
              <form id="loginForm" action="php/Login.php" method="post" novalidate>
                <input type="hidden" name="next" id="loginNext" value="" />
                <div class="form-floating mb-3">
                  <input
                    class="form-control"
                    id="loginEmail"
                    name="email"
                    type="email"
                    placeholder="name@example.com"
                    required
                    autocomplete="email"
                  />
                  <label for="loginEmail">Email address</label>
                </div>
                <div class="form-floating mb-4">
                  <input
                    class="form-control"
                    id="loginPassword"
                    name="password"
                    type="password"
                    placeholder="Password"
                    required
                    autocomplete="current-password"
                  />
                  <label for="loginPassword">Password</label>
                </div>
                <div class="d-grid gap-2">
                  <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
                  <a class="btn btn-outline-secondary" href="register.html">Create an account</a>
                  <a class="btn btn-link text-decoration-none" href="pets.html">Continue without signing in</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-3 mt-auto bg-white border-top text-center small text-muted">
      &copy; 2026 The stray Station
    </footer>

    <script src="js/login-page.js"></script>
  </body>
</html>
