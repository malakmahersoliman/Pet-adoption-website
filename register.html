<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - The Stray Station</title>
    <link
      rel="shortcut icon"
      type="x-icon"
      href="https://cdn-icons-png.flaticon.com/256/2960/2960221.png"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body class="site-sticky-footer bg-light">
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm">
      <div class="container py-2">
        <a class="navbar-brand mb-0 fw-semibold" href="index.html">The stray Station</a>
        <div class="nav-auth-cluster d-flex align-items-center ms-auto">
          <a class="nav-link py-1" href="login.html">Sign in</a>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 d-flex flex-column justify-content-center bg-primary text-light w-100 py-4 py-md-5">
      <div class="container px-4 px-lg-5 py-4">
        <div class="row justify-content-center">
          <div class="col-lg-8 text-center mb-4">
            <h1 class="h2 mb-3">Create your account</h1>
            <p class="text-white-75 mb-0 small mx-auto" style="max-width: 36rem">
              Create an account in the database to manage shelter listings (authenticated CRUD) and track adoption activity.
            </p>
          </div>
        </div>
        <div class="row justify-content-center">
          <div class="col-md-10 col-lg-6 col-xl-5">
            <div class="bg-white text-dark rounded-3 shadow p-4 p-md-5">
              <div class="alert alert-danger d-none mb-3" id="registerError" role="alert"></div>
              <form id="registerForm" action="php/signup.php" method="post" novalidate>
                <div class="form-floating mb-3">
                  <input
                    class="form-control"
                    id="registerName"
                    name="name"
                    type="text"
                    placeholder="Name"
                    required
                    autocomplete="name"
                  />
                  <label for="registerName">Full name</label>
                </div>
                <div class="form-floating mb-3">
                  <input
                    class="form-control"
                    id="registerEmail"
                    name="email"
                    type="email"
                    placeholder="Email"
                    required
                    autocomplete="email"
                  />
                  <label for="registerEmail">Email</label>
                </div>
                <div class="form-floating mb-3">
                  <input
                    class="form-control"
                    id="registerPhone"
                    name="phone"
                    type="tel"
                    placeholder="Phone"
                    autocomplete="tel"
                  />
                  <label for="registerPhone">Phone (optional)</label>
                </div>
                <div class="form-floating mb-3">
                  <input
                    class="form-control"
                    id="registerPassword"
                    name="password"
                    type="password"
                    placeholder="Password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                  />
                  <label for="registerPassword">Password</label>
                </div>
                <div class="form-floating mb-4">
                  <input
                    class="form-control"
                    id="registerPasswordConfirm"
                    type="password"
                    placeholder="Confirm"
                    required
                    minlength="6"
                    autocomplete="new-password"
                  />
                  <label for="registerPasswordConfirm">Confirm password</label>
                </div>
                <div class="d-grid gap-2">
                  <button class="btn btn-primary btn-lg" type="submit">Register</button>
                  <a class="btn btn-outline-secondary" href="login.html">Already have an account?</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-3 mt-auto bg-white border-top text-center small text-muted">
      &copy; 2026 The stray Station
    </footer>

    <script src="js/register-page.js"></script>
  </body>
</html>
